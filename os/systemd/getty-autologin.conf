# /etc/systemd/system/getty@tty1.service.d/autologin.conf
# Log the tv user straight in, without printing the login banner or clearing the screen,
# so the boot splash stays up until the TV shell draws over it.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin tv --noclear --noissue --nohostname %I $TERM
TTYVTDisallocate=no
