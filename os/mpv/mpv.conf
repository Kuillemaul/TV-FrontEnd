# Intel UHD 630 (OptiPlex 5080): hardware decode for MPEG-2/H.264/HEVC broadcasts.
vo=gpu-next
hwdec=vaapi
# Broadcast TV is interlaced.
deinterlace=auto
input-gamepad=yes
osd-font-size=40
cache=yes
demuxer-max-bytes=64MiB
# Hide the "no file" window flash between channels.
keep-open=no
force-window=immediate
