# Hearth live TV / recordings: remote-friendly mpv bindings.
# Channel up/down (remote CH+/CH-, PgUp/PgDn, or up/down arrows) zap through the channel playlist.
PGUP        playlist-prev ; show-text "${media-title}"
PGDWN       playlist-next ; show-text "${media-title}"
CHANNEL_UP  playlist-prev ; show-text "${media-title}"
CHANNEL_DOWN playlist-next ; show-text "${media-title}"
UP          playlist-prev ; show-text "${media-title}"
DOWN        playlist-next ; show-text "${media-title}"
LEFT        seek -10
RIGHT       seek 30
ENTER       script-binding stats/display-stats
i           show-text "${media-title}  ${time-pos} / ${duration}"
# Back / Esc / gamepad B returns to Hearth.
ESC         quit
BS          quit
BACK        quit
GAMEPAD_ACTION_RIGHT quit
GAMEPAD_DPAD_UP   playlist-prev ; show-text "${media-title}"
GAMEPAD_DPAD_DOWN playlist-next ; show-text "${media-title}"
GAMEPAD_ACTION_DOWN cycle pause
SPACE       cycle pause
PLAY        cycle pause
PLAYPAUSE   cycle pause
MUTE        cycle mute
VOLUME_UP   add volume 5
VOLUME_DOWN add volume -5
