<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hearth</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>
  <body>
    <!-- Same logo as the boot splash (os/plymouth, os/splash.html) until the app is ready. -->
    <div id="splash" style="position: fixed; inset: 0; z-index: 9999; background: #07090e; transition: opacity 0.4s">
      <img src="/splash.png" alt="" style="position: absolute; left: 50%; top: 50%; width: 26vw; transform: translate(-50%, -50%)" />
    </div>
    <script>
      if (location.pathname !== '/') document.getElementById('splash').remove();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
